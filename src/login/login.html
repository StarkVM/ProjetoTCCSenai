<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - TCC</title>

  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="../generico/cssgenerico/style.css">
</head>

<body>

<div id="header"></div>

<main class="main-content">

  <!-- Header amarelo -->
  <section class="recuperar-senha-header">
    <h2 class="titulo-recuperar">
      <span class="material-symbols-outlined">login</span>
      Entrar
    </h2>
  </section>

  <div class="login-container">

    <form id="loginForm" method="POST" action="login.php">

      <label for="email">E-mail</label>
      <input 
        type="email" 
        id="email" 
        name="email"
        placeholder="Digite seu e-mail" 
        required
      >

      <label for="senha">Senha</label>
      <input 
        type="password" 
        id="senha" 
        name="senha"
        placeholder="Digite sua senha" 
        required
      >

      <span id="mostrarsenha" onclick="mostrarSenha()" style="cursor: pointer; font-size: 12px">
        Mostrar senha
      </span>

      <button type="submit" name="submit">Entrar</button>

    </form>

    <a href="../recuperar-senha/recuperar-senha.html">Esqueceu a senha?</a>

    <a href="../cadastro/cadastro.php">
      <button type="button" class="btn-registro">
        Não tem uma conta? Cadastre-se
      </button>
    </a>

    <p id="mensagem"></p>

  </div>

</main>

<div id="footer"></div>

<script src="../generico/jsgenerico/script.js"></script>
<script src="../generico/jsgenerico/frame.js"></script>

</body>
</html>
