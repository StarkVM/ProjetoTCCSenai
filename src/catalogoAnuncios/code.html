<body class="bg-surface text-on-surface">
    <header id="header"></header>
    <main class="pt-28 pb-xl px-gutter max-w-screen-2xl mx-auto">

        <!-- Search & Filter Section -->
        <section class="mb-lg">
            <div class="flex flex-col gap-6">
                <!-- Search Bar -->
                <div class="flex flex-col md:flex-row gap-gutter">
                    <div class="relative flex-grow">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400"
                            data-icon="search">search</span>
                        <input
                            class="w-full pl-12 pr-4 py-4 bg-white border-2 border-zinc-300 focus:border-secondary outline-none font-body-md transition-all shadow-[2px_2px_0px_0px_rgba(0,0,0,0.05)]"
                            placeholder="Pesquisar equipamentos industriais (ex: Escavadeira 20t)..." type="text" />
                    </div>
                    <button id="filter-toggle-btn"
                        class="bg-secondary-container text-on-secondary-container px-8 py-4 font-h3 text-base flex items-center justify-center gap-2 border-2 border-zinc-900 active:scale-95 transition-transform">
                        <span class="material-symbols-outlined" data-icon="filter_list">filter_list</span>
                        FILTRAR
                    </button>
                </div>

                <div id="filters-panel"
                    class="hidden mt-6 bg-[#F8F8F7] border border-[#DDD7CB] p-7 rounded-2xl shadow-sm">

                    <!-- HEADER -->
                    <div class="flex items-center justify-between mb-6">

                        <div>
                            <h3 class="text-2xl font-black text-[#1E1E1E] uppercase tracking-wide">
                                Filtrar Equipamentos
                            </h3>

                            <p class="text-sm text-[#6B7280] mt-1">
                                Selecione os tipos de máquinas desejados
                            </p>
                        </div>

                        <div class="w-14 h-1 bg-[#C58B18] rounded-full"></div>

                    </div>

                    <!-- CHECKBOXES -->
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">

                        <!-- ITEM -->

                            class="group flex items-center gap-3 bg-white border border-[#DDD7CB] hover:border-[#C58B18] rounded-xl px-4 py-4 cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:shadow-md">

                            <input type="checkbox"
                                class="w-5 h-5 cursor-pointer appearance-none rounded border-2 border-[#C58B18] checked:bg-[#C58B18] checked:border-[#C58B18] relative">

                            <span class="text-[#2A2A2A] font-semibold">
                                Escavadeiras
                            </span>
                        </label>

                        <!-- ITEM -->
                        <label
                            class="group flex items-center gap-3 bg-white border border-[#DDD7CB] hover:border-[#C58B18] rounded-xl px-4 py-4 cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:shadow-md">

                            <input type="checkbox"
                                class="w-5 h-5 cursor-pointer appearance-none rounded border-2 border-[#C58B18] checked:bg-[#C58B18] checked:border-[#C58B18] relative">

                            <span class="text-[#2A2A2A] font-semibold">
                                Tratores
                            </span>
                        </label>

                        <!-- ITEM -->
                        <label
                            class="group flex items-center gap-3 bg-white border border-[#DDD7CB] hover:border-[#C58B18] rounded-xl px-4 py-4 cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:shadow-md">

                                                        <input type="checkbox"
                                class="w-5 h-5 cursor-pointer appearance-none rounded border-2 border-[#C58B18] checked:bg-[#C58B18] checked:border-[#C58B18] relative">

                            <span class="text-[#2A2A2A] font-semibold">
                                Retroescavadeiras
                            </span>
                        </label>

                        <!-- ITEM -->
                        <label
                            class="group flex items-center gap-3 bg-white border border-[#DDD7CB] hover:border-[#C58B18] rounded-xl px-4 py-4 cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:shadow-md">

                            <input type="checkbox"
                                class="w-5 h-5 cursor-pointer appearance-none rounded border-2 border-[#C58B18] checked:bg-[#C58B18] checked:border-[#C58B18] relative">

                            <span class="text-[#2A2A2A] font-semibold">
                                Guindastes
                            </span>
                        </label>

                        <!-- ITEM -->
                        <label
                            class="group flex items-center gap-3 bg-white border border-[#DDD7CB] hover:border-[#C58B18] rounded-xl px-4 py-4 cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:shadow-md">

                            <input type="checkbox"

                            <input type="checkbox"
                                class="w-5 h-5 cursor-pointer appearance-none rounded border-2 border-[#C58B18] checked:bg-[#C58B18] checked:border-[#C58B18] relative">

        <div id="pagination" class="mt-xl flex justify-center items-center gap-4">

                <span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
            </button>
            <button
                class="w-12 h-12 flex items-center justify-center border-2 border-zinc-900 bg-zinc-900 text-white font-bold">1</button>
            <button

            <button

            <button id="forward_arrow"
                class="w-12 h-12 flex items-center justify-center border-2 border-zinc-300 hover:border-secondary transition-all">
                <span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
            </button>
        </div>

    <script src="../generico/jsgenerico/frame.js"></script>
    <script src="catalogFiller.js"></script>
    <script>


        const filterToggleBtn = document.getElementById("filter-toggle-btn");
        const filtersPanel = document.getElementById("filters-panel");

        filterToggleBtn.addEventListener("click", () => {
            filtersPanel.classList.toggle("hidden");
        });


        const filterButtons = document.querySelectorAll(".filter-btn");

        filterButtons.forEach(btn => {
            btn.addEventListener("click", () => {

                // remove estilo ativo de todos
                filterButtons.forEach(b => {
                    b.classList.remove("bg-zinc-900", "text-white", "border-zinc-900");
                    b.classList.add("bg-white", "text-zinc-600", "border-zinc-200");
                });

                // adiciona no clicado
                btn.classList.remove("bg-white", "text-zinc-600", "border-zinc-200");
                btn.classList.add("bg-zinc-900", "text-white", "border-zinc-900");
            });
        });
    </script>
</body>

</html>
